name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.linkage }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        linkage: [static, shared]

    steps:
      - name: Check out the sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libboost-dev libssl-dev ninja-build

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install boost openssl@3 ninja

      - name: Cache vcpkg packages
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: build/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          extra_args=()
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            extra_args+=("-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)")
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=${{ matrix.linkage == 'shared' && 'ON' || 'OFF' }} \
            -DANDROIDTVREMOTE_BUILD_EXAMPLES=ON \
            -DANDROIDTVREMOTE_BUILD_TESTS=ON \
            "${extra_args[@]}"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_INSTALLED_DIR="$env:GITHUB_WORKSPACE/build/vcpkg_installed" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_SHARED_LIBS=${{ matrix.linkage == 'shared' && 'ON' || 'OFF' }} `
            -DANDROIDTVREMOTE_BUILD_EXAMPLES=ON `
            -DANDROIDTVREMOTE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release --prefix stage

      - name: Package install tree (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          cmake -E tar czf
          androidtvremote-${{ runner.os }}-${{ runner.arch }}-${{ matrix.linkage }}.tar.gz
          stage

      - name: Package install tree (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -E tar cf
          androidtvremote-${{ runner.os }}-${{ runner.arch }}-${{ matrix.linkage }}.zip
          --format=zip
          stage

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: androidtvremote-${{ runner.os }}-${{ runner.arch }}-${{ matrix.linkage }}
          path: androidtvremote-*
          if-no-files-found: error
          retention-days: 14
